<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuel P</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --fg: #f2f2f2;
      --accent: #6ea8fe;
      --muted: #9aa0a6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 640px; }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.6;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .links {
      margin-top: 2rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm Samuel 👋</h1>
    <p>Welcome to my corner of the web. This site is hosted for free with GitHub Pages.</p>
    <div class="links">
      <a href="https://github.com/samuelp4065" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/seongwoo-park-215066181/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.youtube.com/@samuelp4065" target="_blank" rel="noopener">YouTube</a>
      <a href="mailto:samuelp4065@gmail.com">Email</a>
    </div>
  </main>
</body>
</html>
