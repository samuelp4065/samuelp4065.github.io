<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuel P</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --fg: #f2f2f2;
      --accent: #6ea8fe;
      --muted: #9aa0a6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: 0;
      will-change: transform;
    }
    .bg-blob.one {
      width: 45vmax;
      height: 45vmax;
      top: -15vmax;
      left: -10vmax;
      background: #6ea8fe;
      animation: float1 18s ease-in-out infinite;
    }
    .bg-blob.two {
      width: 40vmax;
      height: 40vmax;
      bottom: -15vmax;
      right: -10vmax;
      background: #b06efe;
      animation: float2 22s ease-in-out infinite;
    }
    .bg-blob.three {
      width: 30vmax;
      height: 30vmax;
      top: 40%;
      left: 50%;
      background: #6efeb0;
      animation: float3 26s ease-in-out infinite;
    }
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(8vw, 6vh) scale(1.15); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-6vw, -8vh) scale(1.1); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-45%, -55%) scale(1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg-blob { animation: none; }
    }
    main {
      max-width: 640px;
      position: relative;
      z-index: 1;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.6;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .links {
      margin-top: 2rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="bg-blob one"></div>
  <div class="bg-blob two"></div>
  <div class="bg-blob three"></div>
  <main>
    <img class="avatar" src="IMG_4055.jpg" alt="Photo of Samuel Park">
    <h1>Hi, I'm Samuel 👋</h1>
    <p>Electrical engineer and Virginia Tech grad focused on controls, robotics, and autonomy. I love building things at the intersection of computer vision, object detection, and autonomous robots &mdash; from AI-agent-driven machines to human-following robots.</p>
    <div class="links">
      <a href="https://github.com/samuelp4065" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/seongwoo-park-215066181/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.youtube.com/@samuelp4065" target="_blank" rel="noopener">YouTube</a>
      <a href="mailto:samuelp4065@gmail.com">Email</a>
    </div>
  </main>
</body>
</html>
